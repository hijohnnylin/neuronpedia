# SAEs that are not in SAELens' pretrained_saes.yaml. Merged into the SAE directory by
# config.get_saelens_neuronpedia_directory_df.
#
# <release>: Hugging Face repo id. SAE.from_pretrained loads it directly.
#   model: Hugging Face model id. Rows use the SAELens model key a pod resolves this to.
#   bos_token: optional. The token the SAEs saw before each prompt, for a model whose
#     tokenizer has no BOS. The server uses it as the BOS, so one pod cannot serve
#     sets that disagree on it.
#   saes:
#     - path: folder in the repo, holding cfg.json and sae_weights.safetensors
#       neuronpedia: <neuronpedia model id>/<source id>
#
# Private repos need an HF_TOKEN with read access.
#
# ICA Lens (arXiv 2606.11722), converted with
# utils/neuronpedia-utils/neuronpedia_utils/icalens/convert_icalens_to_saelens.py.
