[project]
name = "neuronpedia-inference"
version = "1.0.0"
description = "Inference server for Neuronpedia"
authors = [{ name = "johnny", email = "johnny@neuronpedia.org" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "python-dotenv>=1.0.1,<2",
  "numpy>=1.24",
  "psutil>=5.9.8,<6",
  "torch>=1.10; sys_platform == 'linux'",
  # Pin >=2.1.1 on Apple devices due to known MPS errors on 2.1.0
  "torch>=1.10,!=2.0,!=2.1.0; sys_platform != 'linux'",
  # transformers v5 (required by vLLM 0.25); the engine already
  # track it. Dropping the previous <5 cap that pinned vLLM to 0.11.
  "transformers>=5.14",
  "einops>=0.7.0,<0.8",
  "pytest>=8.1.1,<9",
  "huggingface-hub>=1.0",
  "huggingface>=0.0.1,<0.0.2",
  "pandas>=2.2.2,<3",
  # Vector assets are safetensors, so the load path is three tensors and no pickle.
  # (It used to be pickled sklearn PCA objects, which made scikit-learn a runtime dependency
  # of that feature and needed a __main__ shim to unpickle; converting the assets removed both.)
  "safetensors>=0.4",
  # Read for each published artifact's vector.yaml manifest. Declared explicitly rather
  # than leaned on transitively (it arrives via several deps today).
  "pyyaml>=6.0",
  "sae-lens>=6.30.0",
  "fastapi>=0.133.0,<0.137.0",
  "uvicorn>=0.34.0",
  "sentry-sdk[fastapi]>=2.24.1,<3",
  "hf-transfer>=0.1.9,<0.2",
  # vLLM (Linux only) comes via the engine's [vllm] extra -- the engine owns the vLLM
  # backend and its version pin (native extract_hidden_states, capture/steer, prompt_embeds).
  # [quant] adds the `kernels` Triton loader so MXFP4 checkpoints (gpt-oss) load at their
  # native 4 bits on the eager backend. Without it transformers silently dequantizes to bf16
  # (a warning, not an error), which triples gpt-oss-20b's weights from ~13 GiB to ~42 GiB.
  # Serving never takes gradients, so there is no downside to the quantized load.
  # Pinned exactly, not floored. The engine is first-party and moves in lockstep with this service,
  # so "whatever resolves today" is not a version anyone chose: a relock for an unrelated dependency
  # would silently swap the code that serves every activation. Bump this deliberately, in a commit
  # that says why. Source at github.com/decoderesearch/interp-engine.
  # 1.3.0 renamed the vllm-freeze backend to vllm-static and split generation-only out as
  # vllm-generate; freeze_points/frozen_points became static_points. See AGENT_INTEGRATION.md
  # in the engine repo. This service's call sites moved with it in the same commit.
  "interp-engine[vllm,quant]==1.3.3",
]

[dependency-groups]
dev = [
  # "line-profiler>=4.1.3,<5",
  "pytest>=8.3.1,<9",
  "httpx>=0.28.0,<0.29",
  "coverage>=7.6.0,<8",
  # ruff and pyright are pinned to the same ranges in every apps/* project and in
  # interp-engine, so one `ruff format` verdict and one pyright rule set covers the repo.
  # Both are capped at a single minor: `ruff format` output and pyright's checks change
  # between releases, and CI gates on both, so an open ceiling turns an upstream release
  # into a red build on an unrelated PR. The exact versions live in uv.lock.
  "ruff>=0.16.2,<0.17",
  "pyright>=1.1.411,<1.2",
  "pytest-cov>=6.0.0,<7",
]

[tool.pytest.ini_options]
markers = [
  "cuda: test requires a CUDA GPU (skipped on CPU-only runners)",
  "vllm: test requires the vLLM backend (CUDA-only; runs on the GPU CI runner)",
  "chat: exercises instruct/chat models (chat template / completion-chat)",
  "thinking: exercises thinking/reasoning instruct models (e.g. Qwen3 enable_thinking)",
  "gated: requires HF_TOKEN for gated model access (auto-skipped when the token is absent)",
  # Same meaning and name as the engine's own `xl` marker, so one convention covers both
  # suites. Deselected by BOTH CI jobs -- the marker is orthogonal to cuda/gated/thinking, and
  # an xl row that is also gated would otherwise be selected by the GPU job's `or gated`.
  # Run these from model-expectations-manual.yml (workflow_dispatch) or locally: `pytest -m xl`.
  "xl: needs multi-GB weights (gemma-2-2b, llama3.1-8b-it, gpt-oss-20b) — dispatch/local only, never per-PR",
]

[tool.uv]
# This is an application, not a distributable package (was poetry's
# `package-mode = false`), so uv installs the dependencies but not the project.
package = false

# --------------------------------------------------------------- lint / types --
# The ruff and pyright config below is shared verbatim by every apps/* project and by
# interp-engine, so one `ruff format` verdict and one type-check rule set covers the repo.
# Deviations are per-app paths only, and each is commented as such. Changing a rule here
# without changing it in the others is how these configs drifted apart in the first place.

[tool.ruff]
line-length = 120
# target-version is inferred from project.requires-python above.
# `*.md`: ruff 0.16 formats Python code blocks in Markdown by default. Every workflow that runs
# this gate filters Markdown out of its `paths:`, so a docs-only change cannot run the check and
# the failure lands on the next unrelated Python edit instead. Doc examples are also aligned by
# hand for reading, which the formatter collapses. Keep the two decisions together: re-enabling
# this means dropping those `!**/*.md` filters as well.
extend-exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
# pyflakes + pycodestyle errors (F/E) as the floor, plus the rule families that catch defects
# rather than taste: isort (I), pyupgrade (UP), bugbear (B), comprehensions (C4), simplify (SIM),
# return (RET), logging (LOG), and tidy-imports (TID) for the banned typing aliases below.
# Deliberately NOT selected: ANN/D (annotation and docstring mandates), ARG (unused arguments,
# which fire on every framework-required signature), and T20 (bans `print`, which several of
# these servers use as their logging).
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RET", "LOG", "TID"]
ignore = [
  # Line length is the formatter's job. E501 would only fire on the strings, URLs and comments
  # the formatter cannot split, i.e. exactly the cases where wrapping is not an improvement.
  "E501",
  # zip-without-explicit-strict. The correct fix is usually `strict=True`, but that changes
  # behaviour at each of the ~30 call sites in this repo, and a blanket `strict=False` only
  # restates the default while adding noise. Off until someone audits them for real.
  "B905",
]

[tool.ruff.lint.flake8-bugbear]
# B008 (function call in a default argument) is the FastAPI dependency-injection idiom, not the
# mutable-default bug the rule is aimed at: `def route(x: int = Query(...))` is how the framework
# is meant to be used.
extend-immutable-calls = [
  "fastapi.Body",
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Query",
  "fastapi.Security",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Union".msg = "Use `|` instead"
"typing.Optional".msg = "Use `| None` instead"
"typing.Dict".msg = "Use `dict` instead"
"typing.List".msg = "Use `list` instead"

[tool.pyright]
# "standard" rather than "strict": strict additionally demands annotations on every parameter and
# type arguments on every generic, which flags hundreds of sites across these apps without catching
# real defects. Standard still runs the checks that find bugs (None-safety, wrong argument types,
# unreachable code). The long list of `reportUnknown*` suppressions that used to live here was
# dead config: those reports are already off outside strict mode.
typeCheckingMode = "standard"
# torch, transformers and vLLM ship no stubs for large parts of their surface, so this report is
# noise about our dependencies rather than about this code.
reportMissingTypeStubs = "none"
# `exclude` REPLACES pyright's defaults, so the three default patterns have to be repeated. `**/.*`
# is the load-bearing one: without it pyright walks `.venv` (torch/vLLM/transformers) and never
# finishes. Per-app addition: `local_scripts` is a gitignored scratch dir (local pod/deploy helpers)
# that CI never sees, so skipping it keeps a local `uv run pyright .` in agreement with the CI run.
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "local_scripts", "**/build"]
