[project]
name = "sparsity-server"
version = "0.1.0"
description = "FastAPI server for analyzing MLP neuron connections in sparse circuit models"
requires-python = ">=3.10"
# No `circuit-sparsity`: the published package does not contain the `circuit_sparsity.gpt` module
# the checkpoint's remote code imports (see `install_circuit_sparsity_gpt_shim` in server.py), so
# installing it satisfies nothing while pulling mpi4py, streamlit and a plotting stack onto a pod
# that only reads MLP weights.
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "torch",
    "transformers",
    "python-dotenv",
    "sentry-sdk[fastapi]>=2.24.1,<3",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    # ruff and pyright are pinned to the same ranges in every apps/* project and in
    # interp-engine, so one `ruff format` verdict and one pyright rule set covers the repo.
    # Both are capped at a single minor: `ruff format` output and pyright's checks change
    # between releases, and CI gates on both, so an open ceiling turns an upstream release
    # into a red build on an unrelated PR. The exact versions live in uv.lock.
    "ruff>=0.16.2,<0.17",
    "pyright>=1.1.411,<1.2",
]

[tool.uv]
# Application, not a distributable package (installs deps but not the project itself).
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The modules under test (`server`, `schemas`, `dump_openapi`) sit at the project root rather
# than in a package, matching how the server is started (`uvicorn server:app`), so the root has
# to be importable from `tests/`.
pythonpath = ["."]

# --------------------------------------------------------------- lint / types --
# The ruff and pyright config below is shared verbatim by every apps/* project and by
# interp-engine, so one `ruff format` verdict and one type-check rule set covers the repo.
# Deviations are per-app paths only, and each is commented as such. Changing a rule here
# without changing it in the others is how these configs drifted apart in the first place.

[tool.ruff]
line-length = 120
# target-version is inferred from project.requires-python above.
# `*.md`: ruff 0.16 formats Python code blocks in Markdown by default. Every workflow that runs
# this gate filters Markdown out of its `paths:`, so a docs-only change cannot run the check and
# the failure lands on the next unrelated Python edit instead. Doc examples are also aligned by
# hand for reading, which the formatter collapses. Keep the two decisions together: re-enabling
# this means dropping those `!**/*.md` filters as well.
extend-exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
# pyflakes + pycodestyle errors (F/E) as the floor, plus the rule families that catch defects
# rather than taste: isort (I), pyupgrade (UP), bugbear (B), comprehensions (C4), simplify (SIM),
# return (RET), logging (LOG), and tidy-imports (TID) for the banned typing aliases below.
# Deliberately NOT selected: ANN/D (annotation and docstring mandates), ARG (unused arguments,
# which fire on every framework-required signature), and T20 (bans `print`, which several of
# these servers use as their logging).
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RET", "LOG", "TID"]
ignore = [
  # Line length is the formatter's job. E501 would only fire on the strings, URLs and comments
  # the formatter cannot split, i.e. exactly the cases where wrapping is not an improvement.
  "E501",
  # zip-without-explicit-strict. The correct fix is usually `strict=True`, but that changes
  # behaviour at each of the ~30 call sites in this repo, and a blanket `strict=False` only
  # restates the default while adding noise. Off until someone audits them for real.
  "B905",
]

[tool.ruff.lint.flake8-bugbear]
# B008 (function call in a default argument) is the FastAPI dependency-injection idiom, not the
# mutable-default bug the rule is aimed at: `def route(x: int = Query(...))` is how the framework
# is meant to be used.
extend-immutable-calls = [
  "fastapi.Body",
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Query",
  "fastapi.Security",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Union".msg = "Use `|` instead"
"typing.Optional".msg = "Use `| None` instead"
"typing.Dict".msg = "Use `dict` instead"
"typing.List".msg = "Use `list` instead"

[tool.pyright]
# "standard" rather than "strict": strict additionally demands annotations on every parameter and
# type arguments on every generic, which flags hundreds of sites across these apps without catching
# real defects. Standard still runs the checks that find bugs (None-safety, wrong argument types,
# unreachable code).
typeCheckingMode = "standard"
# torch and transformers ship no stubs for large parts of their surface, so this report is noise
# about our dependencies rather than about this code.
reportMissingTypeStubs = "none"
# Per-app deviation: this app is one of the three pyright does not gate in CI, and it is kept at
# zero errors without a complete install to check against.
reportMissingImports = "none"
# `exclude` REPLACES pyright's defaults, so the three default patterns have to be repeated. `**/.*`
# is the load-bearing one: without it pyright walks `.venv` (torch/transformers) and never finishes.
exclude = ["**/node_modules", "**/__pycache__", "**/.*"]
