name: Semantic Versioning and Release Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type (auto detects from commit messages)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - major
          - minor
          - patch

# Add permissions to allow pushing tags and creating releases
permissions:
  contents: write

jobs:
  version:
    name: Semantic Versioning and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git user
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get latest version from tags
        id: get_version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            # No tags yet: start from 1.0.0 and consider the whole history
            VERSION="1.0.0"
            RANGE="HEAD"
          else
            VERSION=${LATEST_TAG#v}
            RANGE="${LATEST_TAG}..HEAD"
          fi
          echo "Latest tag: ${LATEST_TAG:-(none)} / commit range: $RANGE"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "range=$RANGE" >> $GITHUB_OUTPUT

      - name: Determine release type
        id: release_type
        env:
          REQUESTED_TYPE: ${{ github.event.inputs.release_type }}
          RANGE: ${{ steps.get_version.outputs.range }}
        run: |
          # A manual dispatch can force a specific bump, bypassing commit parsing
          if [ -n "$REQUESTED_TYPE" ] && [ "$REQUESTED_TYPE" != "auto" ]; then
            echo "Release type forced by workflow_dispatch: $REQUESTED_TYPE"
            echo "type=$REQUESTED_TYPE" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Scan every commit added since the last tag and keep the highest bump.
          # Anything unrecognized falls through to patch, so untagged commit
          # styles keep releasing exactly as they did before.
          TYPE="patch"
          for SHA in $(git log --format=%H "$RANGE"); do
            SUBJECT=$(git log -1 --format=%s "$SHA")
            BODY=$(git log -1 --format=%b "$SHA")

            # major: [major], a conventional-commit "!" marker, or a BREAKING CHANGE footer
            if printf '%s\n%s' "$SUBJECT" "$BODY" | grep -Eiq '\[major\]' \
              || printf '%s' "$SUBJECT" | grep -Eq '^[a-zA-Z]+(\([^)]*\))?!:' \
              || printf '%s' "$BODY" | grep -Eq '^BREAKING[ -]CHANGE:'; then
              echo "major <- $SHA $SUBJECT"
              TYPE="major"
              break
            fi

            # minor: [minor] or a feat: commit
            if printf '%s\n%s' "$SUBJECT" "$BODY" | grep -Eiq '\[minor\]' \
              || printf '%s' "$SUBJECT" | grep -Eq '^feat(\([^)]*\))?:'; then
              echo "minor <- $SHA $SUBJECT"
              TYPE="minor"
            fi
          done

          echo "Detected release type: $TYPE"
          echo "type=$TYPE" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump_version
        env:
          RELEASE_TYPE: ${{ steps.release_type.outputs.type }}
          CURRENT_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          if [ "$RELEASE_TYPE" == "major" ]; then
            NEW_VERSION="$((MAJOR + 1)).0.0"
          elif [ "$RELEASE_TYPE" == "minor" ]; then
            NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
          else # patch
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git tag -a "v${{ steps.bump_version.outputs.new_version }}" -m "Release v${{ steps.bump_version.outputs.new_version }}"
          git push origin "v${{ steps.bump_version.outputs.new_version }}"

      - name: Generate release notes with commits
        env:
          RANGE: ${{ steps.get_version.outputs.range }}
          RELEASE_TYPE: ${{ steps.release_type.outputs.type }}
        run: |
          echo "## Commits in this release (${RELEASE_TYPE})" > release_notes.md
          if [ -n "$(git log "$RANGE" --oneline)" ]; then
            git log "$RANGE" --pretty=format:"* %h - %s (%an)" >> release_notes.md
          else
            # Possible on a manual dispatch with no new commits since the last tag
            echo "* No new commits since the previous release." >> release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.bump_version.outputs.new_version }}
          name: Release v${{ steps.bump_version.outputs.new_version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
