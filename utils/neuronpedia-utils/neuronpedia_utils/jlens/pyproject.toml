[project]
name = "neuronpedia-jlens"
version = "0.1.0"
description = "Standalone environment for fitting Jacobian lenses (jlens) for Neuronpedia models."
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.0.0",
    "datasets>=3.0.0",
    "huggingface-hub>=0.30.0",
    "numpy>=1.26.0",
    "sentencepiece>=0.2.0",
    "torch>=2.8.0",
    "tqdm>=4.66.0",
    # 5.13.0 restored per-layer-type RoPE for OLMo-3 (huggingface/transformers#46911).
    # 5.0 to 5.12 applied YaRN to its sliding-window layers too, so a lens fitted there
    # encodes a forward pass the served model does not run. See hijohnnylin/neuronpedia#235.
    "transformers>=5.13.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
