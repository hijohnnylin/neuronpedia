[tool.poetry]
name = "neuronpedia-utils"
version = "1.0.0"
description = "Neuronpedia utils - for running batch jobs like auto-interp, exporting data, etc."
authors = ["Neuronpedia <johnny@neuronpedia.org>"]

[tool.poetry.dependencies]
python = "^3.10"
# `^0.12.0` capped typer below 0.13, which is incompatible with click >= 8.2 ("Secondary flag is not
# valid for non-boolean flag" at import time). Since typer is a hard dependency, that cap broke the
# `hf` CLI entirely in any environment installing this package. Only typer.Typer/Option/Context/Abort
# and typer.run are used here, all stable across the range.
typer = {version = ">=0.12.0,<1.0.0"}
sae-dashboard = ">=0.6.8,<0.9"
cuid2 = "^2.0.0"
python-dotenv = "^1.0.0"
psycopg = {version = "^3.3.0", extras = ["binary"]}
pyarrow = "^23.0.0"
pgpq = "^0.11.0"
automated-interpretability = "^0.0.23"

openai = "^1.63.2"
google-genai = "^1.57.0"
boto3 = "^1.35.0"

[tool.poetry.group.dev.dependencies]
line-profiler = "^5.0.0"
# optional: only the converter's --emit-arrow legacy-sidecar mode (and its tests) uses polars;
# the production columnar lane writes/reads Arrow via pyarrow
polars = "^1.40.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api" 